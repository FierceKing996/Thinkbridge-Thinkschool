# Local, free, non-Azure infra for Day 19-21: RabbitMQ stands in for Azure
# Service Bus (topics + DLQ), Redis is HybridCache's L2/backplane. Both are
# open-source and run entirely on your machine - no cloud account needed.
#
# Usage:
#   docker compose up -d
#   dotnet user-secrets set "RabbitMq:HostName" "localhost" --project QuotesApi
#   dotnet user-secrets set "ConnectionStrings:Redis" "localhost:6379" --project QuotesApi
#
# Neither is set in appsettings.*.json - both are opt-in via user-secrets/env
# vars (same pattern this app already uses for Key Vault/App Insights), so
# `dotnet run` and the test suite work with nothing running here at all.
services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI - http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
