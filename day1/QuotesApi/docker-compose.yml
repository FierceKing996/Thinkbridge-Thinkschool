# Local, free, non-Azure infra for Days 19-21, 25 and 26: RabbitMQ stands in for
# Azure Service Bus (topics + DLQ), Redis is HybridCache's L2/backplane, Vault
# stands in for Azure Key Vault, and Jaeger + Prometheus + Grafana stand in for
# Application Insights. All open-source, all run entirely on your machine - no
# cloud account needed.
#
# Usage:
#   docker compose up -d
#   dotnet user-secrets set "RabbitMq:HostName" "localhost" --project QuotesApi
#   dotnet user-secrets set "ConnectionStrings:Redis" "localhost:6379" --project QuotesApi
#   dotnet user-secrets set "Vault:Address" "http://localhost:8200" --project QuotesApi
#   # then, per DAY25_IDENTITY.md, create the AppRole and export
#   # VAULT_ROLE_ID / VAULT_SECRET_ID before `dotnet run`
#   $env:OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4317"   # traces -> Jaeger
#   # Prometheus scrapes QuotesApi's /metrics on its own, nothing to set for that.
#
# None of these are set in appsettings.*.json - all are opt-in via user-secrets/
# env vars (same pattern this app already used for Key Vault/App Insights before
# Days 25-26 replaced them), so `dotnet run` and the test suite work with nothing
# running here at all.
# Day 27: data-tier is on its own network, distinct from the default one - the
# closest free/self-hosted analog to an Azure Private Endpoint (see
# DAY27_SECURITY.md). Ports are still published to the host below because these
# exercises run QuotesApi via `dotnet run` on the host, not as its own container
# in this compose file - a real deployment would instead put the app container
# on data-tier too and drop every port mapping here entirely, so rabbitmq/redis/
# vault/sql are reachable *only* by service name from inside the network, never
# from outside it at all.
networks:
  data-tier:

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    networks: [data-tier]
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI - http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks: [data-tier]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Day 25: HashiCorp Vault (free, open-source) in place of Azure Key Vault - see
  # DAY25_IDENTITY.md. Dev-mode only (in-memory storage, auto-unsealed, root
  # token = "root") - fine for local exercises, never for anything real.
  vault:
    image: hashicorp/vault:1.18
    networks: [data-tier]
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Day 26: Jaeger in place of Application Insights' trace view. All-in-one image
  # speaks OTLP directly (port 4317, gRPC) - QuotesApi's existing AddOtlpExporter()
  # call just needs OTEL_EXPORTER_OTLP_ENDPOINT pointed at it, no new export code.
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "16686:16686" # UI - http://localhost:16686
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # Day 26: Prometheus in place of App Insights' metrics view. Pull-based - it
  # scrapes QuotesApi's own /metrics endpoint per observability/prometheus.yml,
  # QuotesApi doesn't push anything to it.
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090" # UI + API - http://localhost:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Day 26: Grafana in place of App Insights' dashboards/alerts. Not
  # auto-provisioned with a datasource - add Prometheus (http://prometheus:9090)
  # once at http://localhost:3000 (admin/admin) and the PromQL in
  # DAY26_OBSERVABILITY.md works directly in its Explore view.
  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000" # UI - http://localhost:3000 (admin/admin)
    depends_on:
      - prometheus
