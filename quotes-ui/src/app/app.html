<header class="site-header">
  <div class="shell">
    <a class="wordmark" routerLink="/quotes">
      <span class="wordmark__glyph" aria-hidden="true">&ldquo;</span>
      <h1>Quotes</h1>
    </a>
    <nav>
      <a routerLink="/quotes" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        Browse
      </a>
      <a routerLink="/quotes/new" routerLinkActive="is-active">Add a quote</a>
      <a routerLink="/login" routerLinkActive="is-active">Sign in</a>
    </nav>
  </div>
</header>

<main class="shell site-main">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="shell">
    <p>Angular&nbsp;&plus;&nbsp;ASP.NET Core demo &mdash; quotes, collections and token auth.</p>
  </div>
</footer>
