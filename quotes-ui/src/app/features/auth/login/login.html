<section class="login">
  <h2>Log in</h2>
  <p>
    New here?
    <a routerLink="/register" [queryParams]="{ returnUrl }">Create an account</a>.
  </p>

  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }

  <form class="login-form" (submit)="onSubmit($event)" novalidate>
    <label>
      <span>Email</span>
      <input
        type="email"
        name="email"
        autocomplete="email"
        required
        [value]="email()"
        (input)="onEmailInput($any($event.target).value)"
      />
    </label>

    <label>
      <span>Password</span>
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        required
        [value]="password()"
        (input)="onPasswordInput($any($event.target).value)"
      />
    </label>

    <button type="submit" [disabled]="loading() || !canSubmit()">
      {{ loading() ? 'Logging in...' : 'Log in' }}
    </button>
  </form>
</section>
