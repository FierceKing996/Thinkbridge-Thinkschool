<section class="quote-detail">
  @if (invalidParam()) {
    <p class="error">That doesn't look like a valid quote id.</p>
    <a class="back-link" routerLink="/quotes">Back to all quotes</a>
  } @else if (loading()) {
    <p>Loading quote...</p>
  } @else if (error(); as message) {
    <p class="error">{{ message }}</p>
    <a class="back-link" routerLink="/quotes">Back to all quotes</a>
  } @else if (data(); as quote) {
    <article>
      <strong>{{ quote.author }}</strong>
      <p>{{ quote.text }}</p>
    </article>
    <a class="back-link" routerLink="/quotes">Back to all quotes</a>
  }
</section>
